# https://github.com/actions/setup-node
name: Build and test

on: [push]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2-beta
      with:
        node-version: '14'
    - run: yarn install --frozen-lockfile
    # yarn audit returns a non-zero exit code if there are ANY vulnerabilities
    # A return code of 16 or above indicates findings at a "critical" level so let's concentrate on these for now
    - run: yarn audit --level=critical; [[ $? -ge 8 ]] && exit 1 || exit 0
    - run: yarn test:lint
    - run: yarn test:unit
    - run: yarn test:unit:cov
    - run: yarn build
    - run: yarn doc
