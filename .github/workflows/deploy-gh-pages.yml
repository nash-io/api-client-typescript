# Using https://github.com/marketplace/actions/deploy-to-github-pages
# See also https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#onpushpull_requestbranchestags
name: Deploy to Github pages

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  deploy_pages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: npm install --global yarn@1.22.22 --force
    - run: yarn install --frozen-lockfile
    - run: yarn doc

    # start: temporary fix for broken link on nash.io/developers
    - run: mkdir -p website/.vitepress/dist/docs
    - run: echo "<a href='https://nash-io.github.io/api-client-typescript/'>Please visit https://nash-io.github.io/api-client-typescript/</a>" > website/.vitepress/dist/docs/index.html
    # end: temporary fix

    - run: touch website/.vitepress/dist/.nojekyll
    - name: Deploy docs
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: website/.vitepress/dist
